<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimax决策树可视化</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node circle {
            fill: #fff;
            stroke: steelblue;
            stroke-width: 2px;
        }

        .node text {
            font: 12px sans-serif;
        }

        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1.5px;
        }

        .tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="tree-container"></div>
    <div class="tooltip"></div>

    <script>
        // 1. 加载决策树数据（替换为实际生成的JSON路径）
        d3.json("decision_tree.json").then(function(data) {
            // 2. 配置画布参数
            console.log("数据加载成功:", data); // 添加这行
            const width = 1800;
            const height = 1000;
            const margin = { top: 20, right: 120, bottom: 20, left: 300 };

            // 3. 创建D3树布局
            const treeLayout = d3.tree()
                .size([height - margin.top - margin.bottom, width - margin.left - margin.right])
                .separation((a, b) => a.parent === b.parent ? 1 : 2);

            // 4. 转换原始数据为D3层级结构
            const root = d3.hierarchy(data);
            treeLayout(root);

            // 5. 创建SVG画布
            const svg = d3.select("#tree-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // 6. 绘制连接线
            const links = svg.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // 7. 创建节点组
            const nodes = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            // 8. 绘制节点圆圈
            nodes.append("circle")
                .attr("r", 6)
                .style("fill", d => {
                    if (d.data.pruned) return "#999";       // 剪枝节点
                    if (d.data.type === "root") return "#FF5722";  // 根节点
                    return d.data.value > 0 ? "#4CAF50" : "#F44336"; // 正负值颜色
                })
                .style("stroke", "#333")
                .style("stroke-width", 1);

            // 9. 添加节点文本
            nodes.append("text")
                .attr("dx", d => d.children ? -12 : 12)
                .attr("dy", 4)
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => {
                    if (d.data.type === "root") return `ROOT (${d.data.value})`;
                    if (d.data.pruned) return "✂️ Pruned";

                    const move = d.data.move;
                    return `${move.piece} (${move.from[0]},${move.from[1]})→(${move.to[0]},${move.to[1]})
                            ${d.data.value !== null ? `: ${d.data.value}` : ''}`;
                });

            // 10. 添加交互功能
            const tooltip = d3.select(".tooltip");

            nodes.on("mouseover", function(event, d) {
                const details = [
                    `Depth: ${d.data.depth}`,
                    `Alpha: ${d.data.alpha ?? '-'}`,
                    `Beta: ${d.data.beta ?? '-'}`,
                    `Player: ${d.data.maximizing ? 'AI' : 'Human'}`
                ].join('\n');

                tooltip
                    .style("opacity", 1)
                    .html(`<strong>Node Details:</strong><br>${details.replace(/\n/g, '<br>')}`)
                    .style("left", `${event.pageX + 15}px`)
                    .style("top", `${event.pageY - 28}px`);
            });

            nodes.on("mouseout", function() {
                tooltip.style("opacity", 0);
            });

            // 11. 添加展开/折叠功能
            nodes.filter(d => d.children).on("click", function(event, d) {
                d._children = d.children;
                d.children = null;
                update(d);
            });

            function update(source) {
                const newRoot = d3.hierarchy(data);
                treeLayout(newRoot);

                // 更新节点位置
                const nodes = newRoot.descendants();
                const links = newRoot.links();

                // 过渡动画
                svg.transition().duration(500)
                    .selectAll(".node")
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                svg.transition().duration(500)
                    .selectAll(".link")
                    .attr("d", d3.linkHorizontal()
                        .x(d => d.y)
                        .y(d => d.x));
            }

            // 12. 添加缩放功能
            const zoom = d3.zoom()
                .scaleExtent([0.5, 5])
                .on("zoom", (event) => {
                    svg.attr("transform", event.transform);
                });

            d3.select("svg").call(zoom);
        }).catch(function(error) {
    console.error("数据加载失败:", error); // 添加错误处理
  });
    </script>
</body>
</html>
